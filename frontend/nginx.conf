server {
    listen       3000;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Nginx-side proxy to backend ───────────────────────────────────────
    # Requests to /api/proxy/* are forwarded to the backend container with
    # the /api/proxy prefix rewritten to /api so that:
    #
    #   GET /api/proxy/inventory  →  GET http://backend.devbank.local:8080/api/inventory
    #   GET /api/proxy/health     →  GET http://backend.devbank.local:8080/api/health  (404 – no such route)
    #
    # Special cases handled by additional locations:
    #   GET /api/proxy/health     →  GET http://backend.devbank.local:8080/health
    #   GET /api/proxy/           →  GET http://backend.devbank.local:8080/
    location /api/proxy/health {
        proxy_pass         http://backend.devbank.local:8080/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/proxy/inventory {
        proxy_pass         http://backend.devbank.local:8080/api/inventory;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/proxy/ {
        proxy_pass         http://backend.devbank.local:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── Static files / SPA fallback ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # Disable server version disclosure
    server_tokens off;

    # Gzip
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
