<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevBank Inventory Management System</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      color: #fff;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    header .logo {
      font-size: 2rem;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    header p {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-top: 0.2rem;
    }

    /* ── Main container ── */
    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* ── Control bar ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    button#loadBtn {
      background: #0f3460;
      color: #fff;
      border: none;
      padding: 0.65rem 1.5rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button#loadBtn:hover { background: #16213e; }
    button#loadBtn:active { transform: scale(0.97); }
    button#loadBtn:disabled { opacity: 0.6; cursor: not-allowed; }

    #statusBadge {
      font-size: 0.8rem;
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-weight: 600;
      display: none;
    }
    #statusBadge.ok      { background: #d4edda; color: #155724; display: inline-block; }
    #statusBadge.error   { background: #f8d7da; color: #721c24; display: inline-block; }
    #statusBadge.loading { background: #fff3cd; color: #856404; display: inline-block; }

    /* ── Summary cards ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .summary-card {
      background: #fff;
      border-radius: 10px;
      padding: 1.1rem 1.2rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      text-align: center;
    }
    .summary-card .num  { font-size: 2rem; font-weight: 700; color: #0f3460; }
    .summary-card .lbl  { font-size: 0.78rem; color: #666; margin-top: 0.2rem; text-transform: uppercase; letter-spacing: 0.05em; }

    /* ── Table ── */
    .table-wrap {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead tr { background: #0f3460; color: #fff; }
    thead th {
      text-align: left;
      padding: 0.9rem 1.1rem;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    tbody tr { border-bottom: 1px solid #f0f2f5; transition: background 0.15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f5f7fa; }
    tbody td { padding: 0.85rem 1.1rem; font-size: 0.92rem; }

    /* Status pill */
    .pill {
      display: inline-block;
      padding: 0.2rem 0.65rem;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .pill-available  { background: #d4edda; color: #155724; }
    .pill-in-use     { background: #cce5ff; color: #004085; }
    .pill-low-stock  { background: #fff3cd; color: #856404; }
    .pill-default    { background: #e2e3e5; color: #383d41; }

    /* ── Message area ── */
    #messageArea {
      padding: 1.5rem;
      text-align: center;
      color: #666;
      font-size: 0.95rem;
    }
    #messageArea.error { color: #842029; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem;
      color: #888;
      font-size: 0.8rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <span class="logo" aria-hidden="true">🏦</span>
  <div>
    <h1>DevBank Inventory Management System</h1>
    <p>Microservices Demo · AWS ECS Fargate · CodePipeline CI/CD</p>
  </div>
</header>

<!-- ── Main ── -->
<main>

  <div class="controls">
    <button id="loadBtn" aria-label="Load inventory from backend">
      📦 Load Inventory
    </button>
    <span id="statusBadge" role="status" aria-live="polite"></span>
  </div>

  <!-- Summary cards (populated by JS) -->
  <div class="summary-grid" id="summaryGrid" aria-label="Inventory summary"></div>

  <!-- Table / message area -->
  <div class="table-wrap">
    <div id="messageArea">Click <strong>Load Inventory</strong> to fetch data from the backend.</div>
    <table id="inventoryTable" style="display:none;" aria-label="Inventory items">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Item Name</th>
          <th scope="col">Category</th>
          <th scope="col">Quantity</th>
          <th scope="col">Status</th>
        </tr>
      </thead>
      <tbody id="inventoryBody"></tbody>
    </table>
  </div>

</main>

<footer>DevBank Inventory Management System &mdash; DevOps Course Project &copy; 2024</footer>

<script>
  (function () {
    'use strict';

    const loadBtn       = document.getElementById('loadBtn');
    const statusBadge   = document.getElementById('statusBadge');
    const messageArea   = document.getElementById('messageArea');
    const inventoryTable= document.getElementById('inventoryTable');
    const inventoryBody = document.getElementById('inventoryBody');
    const summaryGrid   = document.getElementById('summaryGrid');

    // ── Helpers ────────────────────────────────────────────────────────────

    function setStatus(type, text) {
      statusBadge.className = type;
      statusBadge.textContent = text;
    }

    function showMessage(msg, isError = false) {
      inventoryTable.style.display = 'none';
      summaryGrid.innerHTML = '';
      messageArea.textContent = msg;
      messageArea.className = isError ? 'error' : '';
    }

    function pillClass(status) {
      const s = (status || '').toLowerCase().replace(/\s+/g, '-');
      if (s === 'available')  return 'pill pill-available';
      if (s === 'in-use')     return 'pill pill-in-use';
      if (s === 'low-stock')  return 'pill pill-low-stock';
      return 'pill pill-default';
    }

    function buildSummary(items) {
      const total     = items.length;
      const available = items.filter(i => i.status === 'Available').length;
      const inUse     = items.filter(i => i.status === 'In Use').length;
      const lowStock  = items.filter(i => i.status === 'Low Stock').length;
      const totalQty  = items.reduce((sum, i) => sum + (i.quantity || 0), 0);

      const cards = [
        { num: total,    lbl: 'Item Types' },
        { num: totalQty, lbl: 'Total Units' },
        { num: available,lbl: 'Available' },
        { num: inUse,    lbl: 'In Use' },
        { num: lowStock, lbl: 'Low Stock' },
      ];

      summaryGrid.innerHTML = cards.map(c =>
        `<div class="summary-card">
           <div class="num">${c.num}</div>
           <div class="lbl">${c.lbl}</div>
         </div>`
      ).join('');
    }

    function renderTable(items) {
      inventoryBody.innerHTML = items.map((item, idx) =>
        `<tr>
           <td>${idx + 1}</td>
           <td>${escHtml(item.name)}</td>
           <td>${escHtml(item.category)}</td>
           <td>${item.quantity}</td>
           <td><span class="${pillClass(item.status)}">${escHtml(item.status)}</span></td>
         </tr>`
      ).join('');

      messageArea.style.display = 'none';
      messageArea.className = '';
      inventoryTable.style.display = '';
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Load inventory via server-side proxy ───────────────────────────────
    // The browser calls /api/proxy/inventory on the Express server.
    // Express fetches from BACKEND_URL internally and pipes the JSON back.
    // The Docker-internal hostname "backend" is never exposed to the browser.

    async function loadInventory() {
      loadBtn.disabled = true;
      setStatus('loading', '⏳ Loading…');

      try {
        const res = await fetch('/api/proxy/inventory');

        if (!res.ok) {
          throw new Error(`Backend returned HTTP ${res.status}`);
        }

        const items = await res.json();

        buildSummary(items);
        renderTable(items);
        setStatus('ok', `✅ ${items.length} items loaded`);

      } catch (err) {
        console.error('Failed to load inventory:', err);
        showMessage(
          `⚠️ Could not reach the backend service.\n\nDetails: ${err.message}\n\nMake sure the backend container is running and BACKEND_URL is configured correctly.`,
          true
        );
        setStatus('error', '❌ Connection failed');
      } finally {
        loadBtn.disabled = false;
      }
    }

    // ── Wire up button ──────────────────────────────────────────────────────

    loadBtn.addEventListener('click', loadInventory);

  })();
</script>

</body>
</html>
