services:
  backend:
    build: ./backend
    container_name: devbank-backend
    ports:
      - "18080:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: devbank-frontend
    ports:
      - "13000:3000"
    environment:
      - BACKEND_URL=http://localhost:18080
    depends_on:
      backend:
        condition: service_healthy
